name: tests

on:
  # Branch work is covered by pull_request; listing push for every branch too
  # would run the suite twice per commit on same-repository pull requests.
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0/v4.2-final-2026-08-08/hippocampus-mcp
    steps:
      - uses: actions/checkout@v4

      # Pinned to the runtime the image ships (Dockerfile: python:3.12-slim).
      # Older interpreters differ in ways the suite is meant to catch, most
      # recently datetime.fromisoformat's handling of long fractional seconds.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # textlimits falls back to <workspace>/vendor/tiktoken-cache, which is not
      # tracked; caching it keeps the encoding fetch off the critical path.
      - uses: actions/cache@v4
        with:
          path: phase0/v4.2-final-2026-08-08/hippocampus-mcp/vendor/tiktoken-cache
          key: tiktoken-cl100k-${{ runner.os }}

      - run: pip install "pytest>=8.3,<9" "tiktoken>=0.7,<0.8"

      # conftest.py puts src/, ../scanner and ../hindsight-lab on sys.path, and
      # pyproject's testpaths covers both the gateway and scanner suites.
      - run: python -m pytest
