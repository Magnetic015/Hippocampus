# Hippocampus Compose (plan 06 §6.2). Deploy with:
#   docker compose -p hippocampus --env-file /home/kkp/.config/hippocampus/hippocampus.env up -d
# --env-file is an interpolation source only; every secret is mapped explicitly
# per service below, and missing values fail startup via :?required.

x-labels: &labels
  io.hippocampus.managed: "true"
  io.hippocampus.plan: "v4.2"

services:
  db:
    image: pgvector/pgvector@sha256:${PGVECTOR_DIGEST:?required}
    labels: *labels
    networks: [hippocampus-backend]
    volumes:
      - hippocampus-pgdata:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_DB: hindsight
      POSTGRES_PASSWORD: ${HIPPOCAMPUS_DB_PASSWORD:?required}
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:${HINDSIGHT_DIGEST:?required}
    labels: *labels
    networks: [hippocampus-backend]
    depends_on:
      db: {condition: service_healthy}
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - hippocampus-hf-cache:/home/hindsight/.cache
    env_file:
      - ./hindsight.env          # non-secret fixed settings; mandatory (plan 04 §4.4)
    environment:
      HINDSIGHT_API_DATABASE_URL: "postgresql://hippocampus:${HIPPOCAMPUS_DB_PASSWORD:?required}@db:5432/hindsight"
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_INTERNAL_TOKEN:?required}
      HINDSIGHT_API_LLM_BASE_URL: ${CLIPROXY_OPENAI_BASE_URL:?required}
      HINDSIGHT_API_LLM_API_KEY: ${CLIPROXY_KEY:?required}
      HINDSIGHT_API_LLM_1_BASE_URL: ${CLIPROXY_OPENAI_BASE_URL:?required}
      HINDSIGHT_API_LLM_1_API_KEY: ${CLIPROXY_KEY:?required}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  hippocampus-mcp:
    image: "hippocampus-mcp:${HIPPOCAMPUS_MCP_TAG:?required}"
    labels: *labels
    networks: [hippocampus-backend]
    # MCP must not block on Hindsight health (plan 06 §6.3)
    ports:
      - "192.168.2.41:8888:8080"
    user: "${KKP_UID:?required}:${KKP_GID:?required}"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - /home/kkp/hippocampus/vault:/data/vault
      - /home/kkp/hippocampus/state:/data/state
    environment:
      HIPPOCAMPUS_MODE: ${HIPPOCAMPUS_MODE:?required}
      HIPPOCAMPUS_DB: /data/state/outbox.db
      HIPPOCAMPUS_VAULT: /data/vault
      HIPPOCAMPUS_BIND_HOST: 0.0.0.0
      HIPPOCAMPUS_BIND_PORT: "8080"
      HIPPOCAMPUS_HINDSIGHT_BASE: http://hindsight:8000
      HIPPOCAMPUS_HINDSIGHT_TOKEN: ${HINDSIGHT_INTERNAL_TOKEN:?required}
      HIPPOCAMPUS_TOKEN_PEPPER: ${HIPPOCAMPUS_TOKEN_PEPPER:?required}
      HIPPOCAMPUS_AUDIT_HMAC_KEY: ${HIPPOCAMPUS_AUDIT_HMAC_KEY:?required}
      HIPPOCAMPUS_IDEMPOTENCY_HMAC_KEY: ${HIPPOCAMPUS_IDEMPOTENCY_HMAC_KEY:?required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  hippocampus-backend:
    name: hippocampus-backend
    driver: bridge
    internal: false            # Hindsight needs cliproxy/HF egress (plan 06 §6.2)
    labels: *labels

volumes:
  hippocampus-pgdata:
    name: hippocampus-pgdata
    labels: *labels
  hippocampus-hf-cache:
    name: hippocampus-hf-cache
    labels: *labels
